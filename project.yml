name: Bgmori
options:
  bundleIdPrefix: com.yaron
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Bgmori:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    preBuildScripts:
      - name: Build ECH transport
        script: /bin/bash "$SRCROOT/scripts/build-ech-library.sh"
        basedOnDependencyAnalysis: false
    sources:
      - path: Bgmori
        excludes:
          - "Resources/Info.plist"
    info:
      path: Bgmori/Resources/Info.plist
      properties:
        CFBundleDisplayName: Bgmori
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers: [com.yaron.bgmori.refresh-reminders]
        UIBackgroundModes: [fetch]
        UIPrerenderedIcon: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleURLTypes:
          - CFBundleURLName: com.yaron.bgmori.oauth
            CFBundleURLSchemes: [bgmori]
        BGMApiClientID: ""
        BGMApiClientSecret: ""
        BGMOAuthRedirect: "bgmori://oauth/callback"
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BGMORI_ECH"
        SWIFT_OBJC_BRIDGING_HEADER: Bgmori/Core/API/ECHBridge.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/ech/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lBgmoriECH -framework Security -framework CoreFoundation -lresolv"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconFlat
        PRODUCT_BUNDLE_IDENTIFIER: com.yaron.bgmori
        PRODUCT_NAME: Bgmori
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bgmori/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  Bgmori:
    build:
      targets:
        Bgmori: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
